<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gallery | Okuokpellagbe of Okpella</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- Global CSS -->

    <link rel="stylesheet" href="css/reset.css">

    <link rel="stylesheet" href="css/variables.css">

    <link rel="stylesheet" href="css/typography.css">

    <link rel="stylesheet" href="css/global.css">

    <link rel="stylesheet" href="css/utilities.css">

    <link rel="stylesheet" href="css/navigation.css">

    <link rel="stylesheet" href="css/gallery-page.css">

    <link rel="stylesheet" href="css/footer.css">

</head>

<body>

    <!-- Navigation -->

    <div id="navbar"></div>

    <!-- ==========================
         Gallery Hero
    =========================== -->

    <section class="gallery-hero">

        <div class="gallery-overlay"></div>

        <div class="container">

            <div class="gallery-hero-content">

                <span>

                    Royal Palace

                </span>

                <h1>

                    Royal Gallery

                </h1>

                <p>

                    Explore memorable moments, royal ceremonies,
                    cultural festivals and official palace events.

                </p>

            </div>

        </div>

    </section>

    <!-- ==========================
         Gallery Grid
    =========================== -->

    <section class="gallery-section">

        <div class="container">

            <div class="gallery-grid">

                <!-- Repeat this card -->

                <div class="gallery-item">

                    <img src="images/gallery/gallery-1.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-2.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-3.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-4.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-5.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-6.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-7.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-8.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-9.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-10.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>
   

                <div class="gallery-item">

                    <img src="images/gallery/gallery-11.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

                <div class="gallery-item">

                    <img src="images/gallery/gallery-12.jpg"
                         alt="Gallery Image">

                    <div class="gallery-hover">

                        <i class="fa-solid fa-expand"></i>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ==========================================
     LIGHTBOX
========================================== -->

<div class="lightbox">

    <button class="lightbox-close">

        <i class="fa-solid fa-xmark"></i>

    </button>

    <button class="lightbox-prev">

        <i class="fa-solid fa-chevron-left"></i>

    </button>

    <div class="lightbox-content">

        <img
            src=""
            alt="Gallery Image"
            class="lightbox-image">

    </div>

    <button class="lightbox-next">

        <i class="fa-solid fa-chevron-right"></i>

    </button>

</div>

    <!-- Footer -->

    <div id="footer"></div>

    <!-- Scripts -->

    <script src="js/app.js"></script>

    <script src="js/navigation.js"></script>

    <script src="js/gallery.js"></script>

</body>

</html>
